name: Verify TrustedMeds demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify store, admin and backend
        run: npm test
      - name: Verify main branch Pages files match source
        run: node scripts/sync-pages.cjs --check
